<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tarot Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-indigo-800 text-white min-h-screen">
    <div class="min-h-screen">
        <div class="max-w-4xl mx-auto p-6">
            <!-- Header -->
            <header class="text-center mb-8 pt-6">
                <h1 class="text-4xl font-serif mb-2">✨ Daily Tarot Companion ✨</h1>
                <p class="text-purple-200 text-sm">Rider-Waite Deck Readings</p>
            </header>

            <!-- API Key Section -->
            <div id="apiSection" class="bg-blue-500/20 border border-blue-500 rounded-lg p-4 mb-6">
                <p class="text-sm mb-3">🔑 Voer je OpenAI API key in om de app te gebruiken.</p>
                <input
                    id="apiKeyInput"
                    type="password"
                    placeholder="Voer je OpenAI API key in..."
                    class="w-full bg-white/10 border border-white/20 rounded px-3 py-2 text-white text-sm mb-2"
                />
                <p class="text-xs text-purple-200">
                    Krijg een gratis key op <a href="https://platform.openai.com/api-keys" target="_blank" class="underline">platform.openai.com</a>
                </p>
            </div>

            <!-- Navigation -->
            <nav class="flex gap-2 mb-6 bg-white/10 rounded-lg p-1">
                <button
                    onclick="switchView('input')"
                    id="navInput"
                    class="flex-1 py-2 px-4 rounded transition bg-white/20"
                >
                    📖 Nieuwe Reading
                </button>
                <button
                    onclick="switchView('history')"
                    id="navHistory"
                    class="flex-1 py-2 px-4 rounded transition hover:bg-white/5"
                >
                    📅 Geschiedenis
                </button>
            </nav>

            <!-- Input View -->
            <div id="inputView" class="bg-white/10 backdrop-blur rounded-lg p-6 shadow-xl">
                <h2 class="text-2xl font-serif mb-6 text-center">Voer Je Drie Kaarten In</h2>
                <div id="cardsContainer"></div>
                <button
                    onclick="generateReading()"
                    id="generateBtn"
                    class="w-full mt-6 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 py-3 rounded-lg font-semibold transition disabled:opacity-50"
                >
                    ✨ Reading Genereren
                </button>
            </div>

            <!-- Reading View -->
            <div id="readingView" class="hidden bg-white/10 backdrop-blur rounded-lg p-6 shadow-xl">
                <h2 class="text-2xl font-serif mb-4 text-center">Je Reading</h2>
                <div class="grid grid-cols-3 gap-4 mb-6" id="readingCards"></div>
                <div id="readingContent" class="whitespace-pre-wrap leading-relaxed text-purple-50 mb-6 max-h-96 overflow-y-auto"></div>
                <button
                    onclick="switchView('input')"
                    class="w-full bg-white/10 hover:bg-white/20 py-3 rounded-lg font-semibold transition"
                >
                    Nieuwe Reading
                </button>
            </div>

            <!-- History View -->
            <div id="historyView" class="hidden bg-white/10 backdrop-blur rounded-lg p-6 shadow-xl">
                <h2 class="text-2xl font-serif mb-6 text-center">Reading Geschiedenis</h2>
                <div id="historyContent"></div>
            </div>
        </div>
    </div>

    <script>
        const MAJOR_ARCANA = [
            'The Fool', 'The Magician', 'The High Priestess', 'The Empress', 'The Emperor',
            'The Hierophant', 'The Lovers', 'The Chariot', 'Strength', 'The Hermit',
            'Wheel of Fortune', 'Justice', 'The Hanged Man', 'Death', 'Temperance',
            'The Devil', 'The Tower', 'The Star', 'The Moon', 'The Sun', 'Judgement', 'The World'
        ];

        const MINOR_ARCANA = {
            'Wands': ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Page', 'Knight', 'Queen', 'King'],
            'Cups': ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Page', 'Knight', 'Queen', 'King'],
            'Swords': ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Page', 'Knight', 'Queen', 'King'],
            'Pentacles': ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Page', 'Knight', 'Queen', 'King']
        };

        let cards = [
            { card: '', orientation: 'upright', position: 'Past' },
            { card: '', orientation: 'upright', position: 'Present' },
            { card: '', orientation: 'upright', position: 'Future' }
        ];

        function init() {
            const savedKey = localStorage.getItem('openai-api-key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }

            document.getElementById('apiKeyInput').addEventListener('change', function() {
                localStorage.setItem('openai-api-key', this.value);
            });

            renderCards();
            loadHistory();
        }

        function renderCards() {
            let html = '';
            for (let i = 0; i < 3; i++) {
                const card = cards[i];
                html += '<div class="bg-white/5 rounded-lg p-4 mb-4">';
                html += '<label class="block text-sm font-semibold mb-2 text-purple-200">Kaart ' + (i + 1) + ' - ' + card.position + '</label>';
                html += '<select onchange="updateCard(' + i + ', this.value)" class="w-full bg-white/10 border border-white/20 rounded px-3 py-2 mb-3 text-white">';
                html += '<option value="">Selecteer een kaart...</option>';
                html += '<optgroup label="Major Arcana">';
                for (let j = 0; j < MAJOR_ARCANA.length; j++) {
                    html += '<option value="' + MAJOR_ARCANA[j] + '">' + MAJOR_ARCANA[j] + '</option>';
                }
                html += '</optgroup>';
                for (const suit in MINOR_ARCANA) {
                    html += '<optgroup label="' + suit + '">';
                    for (let j = 0; j < MINOR_ARCANA[suit].length; j++) {
                        const rank = MINOR_ARCANA[suit][j];
                        html += '<option value="' + rank + ' of ' + suit + '">' + rank + ' of ' + suit + '</option>';
                    }
                    html += '</optgroup>';
                }
                html += '</select>';
                html += '<div class="flex gap-4">';
                html += '<label class="flex items-center gap-2 cursor-pointer">';
                html += '<input type="radio" name="orient' + i + '" ' + (card.orientation === 'upright' ? 'checked' : '') + ' onchange="updateOrientation(' + i + ', \'upright\')" />';
                html += '<span>Rechtop</span>';
                html += '</label>';
                html += '<label class="flex items-center gap-2 cursor-pointer">';
                html += '<input type="radio" name="orient' + i + '" ' + (card.orientation === 'reversed' ? 'checked' : '') + ' onchange="updateOrientation(' + i + ', \'reversed\')" />';
                html += '<span>Omgekeerd</span>';
                html += '</label>';
                html += '</div>';
                html += '</div>';
            }
            document.getElementById('cardsContainer').innerHTML = html;
        }

        function updateCard(index, value) {
            cards[index].card = value;
        }

        function updateOrientation(index, value) {
            cards[index].orientation = value;
        }

        function switchView(view) {
            const inputView = document.getElementById('inputView');
            const readingView = document.getElementById('readingView');
            const historyView = document.getElementById('historyView');
            const navInput = document.getElementById('navInput');
            const navHistory = document.getElementById('navHistory');

            if (view === 'input') {
                inputView.classList.remove('hidden');
                readingView.classList.add('hidden');
                historyView.classList.add('hidden');
                navInput.classList.add('bg-white/20');
                navHistory.classList.remove('bg-white/20');
            } else if (view === 'history') {
                inputView.classList.add('hidden');
                readingView.classList.add('hidden');
                historyView.classList.remove('hidden');
                navInput.classList.remove('bg-white/20');
                navHistory.classList.add('bg-white/20');
                loadHistory();
            }
        }

        async function generateReading() {
            const apiKey = document.getElementById('apiKeyInput').value;

            if (!apiKey) {
                alert('Voer eerst je OpenAI API key in!');
                return;
            }

            if (!cards[0].card || !cards[1].card || !cards[2].card) {
                alert('Selecteer alstublieft alle drie kaarten');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Wijsheid ontvangen...';

            try {
                const prompt = 'You are an experienced tarot reader using the Rider-Waite deck. I have drawn three cards for my daily reading:\n\n' +
                    '1. ' + cards[0].card + ' (' + cards[0].orientation + ') - Position: ' + cards[0].position + '\n' +
                    '2. ' + cards[1].card + ' (' + cards[1].orientation + ') - Position: ' + cards[1].position + '\n' +
                    '3. ' + cards[2].card + ' (' + cards[2].orientation + ') - Position: ' + cards[2].position + '\n\n' +
                    'Please provide a deep, nuanced reading that:\n' +
                    '- Interprets each card in its position, considering the Rider-Waite symbolism\n' +
                    '- Explores how these cards work together and what patterns they reveal\n' +
                    '- Offers guidance for my day and week ahead\n' +
                    '- Speaks with warmth, wisdom, and insight\n\n' +
                    'Keep the reading personal, meaningful, and around 300-400 words.';

                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [{
                            role: 'user',
                            content: prompt
                        }],
                        max_tokens: 1000,
                        temperature: 0.7
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    if (data.error) {
                        throw new Error(data.error.message);
                    }
                    throw new Error('API Error: ' + response.status);
                }

                const readingText = data.choices[0].message.content;

                // Display reading
                let cardsHtml = '';
                for (let i = 0; i < 3; i++) {
                    cardsHtml += '<div class="bg-white/5 rounded p-3 text-center">';
                    cardsHtml += '<div class="text-xs text-purple-200 mb-1">' + cards[i].position + '</div>';
                    cardsHtml += '<div class="font-semibold text-sm">' + cards[i].card + '</div>';
                    cardsHtml += '<div class="text-xs text-yellow-300 mt-1">' + cards[i].orientation + '</div>';
                    cardsHtml += '</div>';
                }
                document.getElementById('readingCards').innerHTML = cardsHtml;
                document.getElementById('readingContent').textContent = readingText;

                // Save to history
                const historyItem = {
                    timestamp: Date.now(),
                    date: new Date().toLocaleDateString(),
                    cards: JSON.parse(JSON.stringify(cards)),
                    reading: readingText
                };

                let history = [];
                const stored = localStorage.getItem('tarot-readings');
                if (stored) {
                    history = JSON.parse(stored);
                }
                history.push(historyItem);
                localStorage.setItem('tarot-readings', JSON.stringify(history));

                switchView('reading');
            } catch (error) {
                alert('Fout: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ Reading Genereren';
            }
        }

        function loadHistory() {
            const historyContent = document.getElementById('historyContent');
            const stored = localStorage.getItem('tarot-readings');

            if (!stored) {
                historyContent.innerHTML = '<div class="text-center py-12 text-purple-200">Nog geen readings. Maak je eerste dagelijkse reading!</div>';
                return;
            }

            const history = JSON.parse(stored);
            if (history.length === 0) {
                historyContent.innerHTML = '<div class="text-center py-12 text-purple-200">Nog geen readings. Maak je eerste dagelijkse reading!</div>';
                return;
            }

            history.sort(function(a, b) {
                return b.timestamp - a.timestamp;
            });

            let html = '<div class="space-y-4">';
            for (let i = 0; i < history.length; i++) {
                const item = history[i];
                html += '<div onclick="viewHistoryItem(' + i + ')" class="bg-white/5 hover:bg-white/10 rounded-lg p-4 cursor-pointer transition">';
                html += '<div class="flex justify-between items-start mb-2">';
                html += '<span class="font-semibold">' + item.date + '</span>';
                html += '<span class="text-yellow-300">📈</span>';
                html += '</div>';
                html += '<div class="text-sm text-purple-200">';
                html += item.cards[0].card + ' • ' + item.cards[1].card + ' • ' + item.cards[2].card;
                html += '</div>';
                html += '</div>';
            }
            html += '</div>';
            historyContent.innerHTML = html;
        }

        function viewHistoryItem(index) {
            const stored = localStorage.getItem('tarot-readings');
            const history = JSON.parse(stored);
            history.sort(function(a, b) {
                return b.timestamp - a.timestamp;
            });
            const item = history[index];

            let cardsHtml = '';
            for (let i = 0; i < 3; i++) {
                cardsHtml += '<div class="bg-white/5 rounded p-3 text-center">';
                cardsHtml += '<div class="text-xs text-purple-200 mb-1">' + item.cards[i].position + '</div>';
                cardsHtml += '<div class="font-semibold text-sm">' + item.cards[i].card + '</div>';
                cardsHtml += '<div class="text-xs text-yellow-300 mt-1">' + item.cards[i].orientation + '</div>';
                cardsHtml += '</div>';
            }
            document.getElementById('readingCards').innerHTML = cardsHtml;
            document.getElementById('readingContent').textContent = item.reading;

            switchView('reading');
        }

        // Initialize
        window.addEventListener('load', init);
    </script>
</body>
</html>
