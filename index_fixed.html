<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tarot Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        h1, h2 {
            font-family: Georgia, 'Times New Roman', serif;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .hidden {
            display: none;
        }
        .visible {
            display: block;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-indigo-800 text-white min-h-screen">
    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-indigo-800 text-white">
        <div class="max-w-4xl mx-auto p-6">
            <!-- Header -->
            <header class="text-center mb-8 pt-6">
                <div class="flex items-center justify-center gap-3 mb-2">
                    <h1 class="text-4xl font-serif">✨ Daily Tarot Companion ✨</h1>
                </div>
                <p class="text-purple-200 text-sm">Rider-Waite Deck Readings</p>
            </header>

            <!-- API Key Warning -->
            <div id="apiKeyWarning" class="bg-red-500/20 border border-red-500 rounded-lg p-4 mb-6">
                <p class="text-sm mb-3">⚠️ Je moet je Anthropic API key invoeren om de app te gebruiken.</p>
                <input
                    id="apiKeyInput"
                    type="password"
                    placeholder="Voer je Anthropic API key in..."
                    class="w-full bg-white/10 border border-white/20 rounded px-3 py-2 text-white text-sm"
                />
                <p class="text-xs text-purple-200 mt-2">
                    Krijg een gratis key op <a href="https://console.anthropic.com" target="_blank" class="underline">console.anthropic.com</a>
                </p>
            </div>

            <!-- Navigation -->
            <nav class="flex gap-2 mb-6 bg-white/10 rounded-lg p-1">
                <button
                    onclick="showView('input')"
                    id="btnInput"
                    class="flex-1 py-2 px-4 rounded transition bg-white/20"
                >
                    📖 Nieuwe Reading
                </button>
                <button
                    onclick="showView('history')"
                    id="btnHistory"
                    class="flex-1 py-2 px-4 rounded transition hover:bg-white/5"
                >
                    📅 Geschiedenis
                </button>
            </nav>

            <!-- Input View -->
            <div id="inputView" class="bg-white/10 backdrop-blur rounded-lg p-6 shadow-xl">
                <h2 class="text-2xl font-serif mb-6 text-center">Voer Je Drie Kaarten In</h2>
                
                <div class="space-y-6" id="cardsContainer"></div>

                <button
                    onclick="generateReading()"
                    id="generateBtn"
                    class="w-full mt-6 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 py-3 rounded-lg font-semibold transition disabled:opacity-50"
                >
                    ✨ Reading Genereren
                </button>
            </div>

            <!-- Reading View -->
            <div id="readingView" class="hidden bg-white/10 backdrop-blur rounded-lg p-6 shadow-xl">
                <div class="mb-6">
                    <h2 class="text-2xl font-serif mb-4 text-center">Je Reading</h2>
                    <div class="grid grid-cols-3 gap-4 mb-6" id="readingCards"></div>
                </div>

                <div id="readingContent" class="whitespace-pre-wrap leading-relaxed text-purple-50 mb-6"></div>

                <button
                    onclick="showView('input')"
                    class="w-full bg-white/10 hover:bg-white/20 py-3 rounded-lg font-semibold transition"
                >
                    Nieuwe Reading
                </button>
            </div>

            <!-- History View -->
            <div id="historyView" class="hidden bg-white/10 backdrop-blur rounded-lg p-6 shadow-xl">
                <h2 class="text-2xl font-serif mb-6 text-center">Reading Geschiedenis</h2>
                <div id="historyContent" class="text-center py-12 text-purple-200">
                    Nog geen readings. Maak je eerste dagelijkse reading!
                </div>
            </div>
        </div>
    </div>

    <script>
        const MAJOR_ARCANA = [
            'The Fool', 'The Magician', 'The High Priestess', 'The Empress', 'The Emperor',
            'The Hierophant', 'The Lovers', 'The Chariot', 'Strength', 'The Hermit',
            'Wheel of Fortune', 'Justice', 'The Hanged Man', 'Death', 'Temperance',
            'The Devil', 'The Tower', 'The Star', 'The Moon', 'The Sun', 'Judgement', 'The World'
        ];

        const MINOR_ARCANA = {
            'Wands': ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Page', 'Knight', 'Queen', 'King'],
            'Cups': ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Page', 'Knight', 'Queen', 'King'],
            'Swords': ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Page', 'Knight', 'Queen', 'King'],
            'Pentacles': ['Ace', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Page', 'Knight', 'Queen', 'King']
        };

        let currentCards = [
            { card: '', orientation: 'upright', position: 'Past' },
            { card: '', orientation: 'upright', position: 'Present' },
            { card: '', orientation: 'upright', position: 'Future' }
        ];

        let currentView = 'input';

        // Initialize
        function init() {
            const savedKey = localStorage.getItem('anthropic-api-key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }

            document.getElementById('apiKeyInput').addEventListener('change', (e) => {
                localStorage.setItem('anthropic-api-key', e.target.value);
            });

            renderCards();
            loadHistory();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = currentCards.map((card, index) => `
                <div class="bg-white/5 rounded-lg p-4">
                    <label class="block text-sm font-semibold mb-2 text-purple-200">
                        Kaart ${index + 1} - ${card.position}
                    </label>
                    
                    <select
                        onchange="updateCard(${index}, 'card', this.value)"
                        class="w-full bg-white/10 border border-white/20 rounded px-3 py-2 mb-3 text-white"
                    >
                        <option value="">Selecteer een kaart...</option>
                        <optgroup label="Major Arcana">
                            ${MAJOR_ARCANA.map(c => `<option value="${c}">${c}</option>`).join('')}
                        </optgroup>
                        ${Object.entries(MINOR_ARCANA).map(([suit, ranks]) => `
                            <optgroup label="${suit}">
                                ${ranks.map(rank => `<option value="${rank} of ${suit}">${rank} of ${suit}</option>`).join('')}
                            </optgroup>
                        `).join('')}
                    </select>

                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                type="radio"
                                name="orientation-${index}"
                                ${card.orientation === 'upright' ? 'checked' : ''}
                                onchange="updateCard(${index}, 'orientation', 'upright')"
                            />
                            <span>Rechtop</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input
                                type="radio"
                                name="orientation-${index}"
                                ${card.orientation === 'reversed' ? 'checked' : ''}
                                onchange="updateCard(${index}, 'orientation', 'reversed')"
                            />
                            <span>Omgekeerd</span>
                        </label>
                    </div>
                </div>
            `).join('');
        }

        function updateCard(index, field, value) {
            currentCards[index][field] = value;
        }

        function showView(view) {
            currentView = view;
            document.getElementById('inputView').classList.toggle('hidden', view !== 'input');
            document.getElementById('readingView').classList.toggle('hidden', view !== 'reading');
            document.getElementById('historyView').classList.toggle('hidden', view !== 'history');

            document.getElementById('btnInput').classList.toggle('bg-white/20', view === 'input');
            document.getElementById('btnInput').classList.toggle('hover:bg-white/5', view !== 'input');
            document.getElementById('btnHistory').classList.toggle('bg-white/20', view === 'history');
            document.getElementById('btnHistory').classList.toggle('hover:bg-white/5', view !== 'history');

            if (view === 'history') {
                loadHistory();
            }
        }

        async function generateReading() {
            const apiKey = document.getElementById('apiKeyInput').value;
            
            if (!apiKey) {
                alert('Voer eerst je Anthropic API key in!');
                return;
            }

            if (currentCards.some(c => !c.card)) {
                alert('Selecteer alstublieft alle drie kaarten');
                return;
            }

            document.getElementById('generateBtn').disabled = true;
            document.getElementById('generateBtn').textContent = '⏳ Wijsheid ontvangen...';

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: `You are an experienced tarot reader using the Rider-Waite deck. I've drawn three cards for my daily reading:

${currentCards.map((c, i) => `${i + 1}. ${c.card} (${c.orientation}) - Position: ${c.position}`).join('\n')}

Please provide a deep, nuanced reading that:
- Interprets each card in its position, considering the Rider-Waite symbolism
- Explores how these cards work together and what patterns they reveal
- Offers guidance for my day and week ahead
- Speaks with warmth, wisdom, and insight

Keep the reading personal, meaningful, and around 300-400 words.`
                        }]
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || 'Failed to generate reading');
                }

                const readingText = data.content.map(item => item.type === 'text' ? item.text : '').join('\n');
                
                // Show reading
                document.getElementById('readingCards').innerHTML = currentCards.map((card, i) => `
                    <div class="bg-white/5 rounded p-3 text-center">
                        <div class="text-xs text-purple-200 mb-1">${card.position}</div>
                        <div class="font-semibold text-sm">${card.card}</div>
                        <div class="text-xs text-yellow-300 mt-1">${card.orientation}</div>
                    </div>
                `).join('');

                document.getElementById('readingContent').textContent = readingText;

                // Save to history
                const readingData = {
                    timestamp: Date.now(),
                    date: new Date().toLocaleDateString(),
                    cards: currentCards,
                    reading: readingText
                };

                const stored = localStorage.getItem('tarot-readings') || '[]';
                const readings = JSON.parse(stored);
                readings.push(readingData);
                localStorage.setItem('tarot-readings', JSON.stringify(readings));

                showView('reading');
            } catch (error) {
                document.getElementById('readingContent').textContent = `Fout: ${error.message}`;
                showView('reading');
            } finally {
                document.getElementById('generateBtn').disabled = false;
                document.getElementById('generateBtn').textContent = '✨ Reading Genereren';
            }
        }

        function loadHistory() {
            try {
                const stored = localStorage.getItem('tarot-readings');
                if (!stored) {
                    document.getElementById('historyContent').innerHTML = '<div class="text-center py-12 text-purple-200">Nog geen readings. Maak je eerste dagelijkse reading!</div>';
                    return;
                }

                const readings = JSON.parse(stored).sort((a, b) => b.timestamp - a.timestamp);
                
                if (readings.length === 0) {
                    document.getElementById('historyContent').innerHTML = '<div class="text-center py-12 text-purple-200">Nog geen readings. Maak je eerste dagelijkse reading!</div>';
                    return;
                }

                document.getElementById('historyContent').innerHTML = `
                    <div class="space-y-4">
                        ${readings.map((item, idx) => `
                            <div
                                onclick="viewHistoryReading(${idx})"
                                class="bg-white/5 hover:bg-white/10 rounded-lg p-4 cursor-pointer transition"
                            >
                                <div class="flex justify-between items-start mb-2">
                                    <span class="font-semibold">${item.date}</span>
                                    <span class="text-yellow-300">📈</span>
                                </div>
                                <div class="text-sm text-purple-200">
                                    ${item.cards.map(c => c.card).join(' • ')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.log('Error loading history:', error);
            }
        }

        function viewHistoryReading(idx) {
            const stored = localStorage.getItem('tarot-readings');
            const readings = JSON.parse(stored);
            const item = readings.sort((a, b) => b.timestamp - a.timestamp)[idx];

            currentCards = item.cards;
            document.getElementById('readingCards').innerHTML = currentCards.map((card, i) => `
                <div class="bg-white/5 rounded p-3 text-center">
                    <div class="text-xs text-purple-200 mb-1">${card.position}</div>
                    <div class="font-semibold text-sm">${card.card}</div>
                    <div class="text-xs text-yellow-300 mt-1">${card.orientation}</div>
                </div>
            `).join('');

            document.getElementById('readingContent').textContent = item.reading;
            showView('reading');
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
